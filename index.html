<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>像素食堂 · 今日菜单</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23eef4ff'/></svg>">
<meta name="theme-color" content="#eef1f9">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="preconnect" href="https://sf3-scmcdn-cn.feishucdn.com" crossorigin>
<link rel="preload" href="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/lark-miaoda-fonts/fonts/press-start-2p/39332efa7a67.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Press+Start+2P&display=swap">
<style>
/* ===== 令牌（亮色 · 柔和玻璃感） ===== */
:root{
  --bg:#eef1f9;
  --ink:#16161f;
  --ink-soft:#3b3b52;
  --muted:#8a8aa3;
  --line:rgba(22,22,31,.10);
  --line2:rgba(22,22,31,.18);
  --shadow:rgba(96,106,150,.16);
  --shadow-soft:rgba(96,106,150,.09);
  --gold:#ffc107;
  --gold-d:#8f6900;
  --gold-soft:rgba(255,203,71,.18);
  --tomato:#ff5c52;
  --mint:#12b886;
  --sky:#2f7cf6;
  --plum:#9b5cff;
  --font-cn:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --font-px:"Press Start 2P",var(--font-cn);
}

/* ===== 强制隐藏 Netlify 悬浮球 ===== */
iframe[src*="netlify"], netlify-badge, #netlify-badge, div[style*="netlify"], a[href*="netlify.com"], [data-netlify-badge] {
  display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; z-index: -9999 !important;
}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  background-color:#eef1f9;
  background-image:
    radial-gradient(1100px 620px at 50% -14%, rgba(255,196,64,.36), rgba(255,196,64,0) 62%),
    radial-gradient(820px 620px at 108% 0%, rgba(155,92,255,.24), rgba(155,92,255,0) 58%),
    radial-gradient(780px 660px at -10% 100%, rgba(47,124,246,.22), rgba(47,124,246,0) 58%),
    radial-gradient(560px 500px at 8% 8%, rgba(46,194,126,.16), rgba(46,194,126,0) 60%),
    radial-gradient(520px 500px at 94% 88%, rgba(255,92,82,.15), rgba(255,92,82,0) 60%),
    radial-gradient(circle at 1px 1px, rgba(22,22,31,.09) 1px, transparent 1.4px),
    repeating-linear-gradient(0deg, rgba(22,22,31,.02) 0 1px, transparent 1px 9px),
    repeating-linear-gradient(90deg, rgba(22,22,31,.02) 0 1px, transparent 1px 9px),
    linear-gradient(180deg,#f4f8ff 0%, #eef1f9 46%, #fbf3e7 100%);
  background-size:auto,auto,auto,auto,auto,16px 16px,auto,auto,auto;
  background-attachment:fixed;
  color:var(--ink);font-family:var(--font-cn);font-size:16px;line-height:1.5;overflow:hidden;
}
body.lock{overflow:hidden}
button{font-family:inherit}
.pxfont{font-family:var(--font-px);letter-spacing:.04em}

/* ===== 应用外壳 ===== */
.app{
  position:relative;width:100%;max-width:430px;height:100dvh;display:flex;flex-direction:column;
  background:linear-gradient(180deg, rgba(255,255,255,.86) 0%, rgba(255,255,255,.70) 100%);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);
  border-left:1px solid rgba(255,255,255,.85);border-right:1px solid rgba(255,255,255,.85);
  box-shadow:0 24px 70px rgba(72,82,130,.18);overflow:hidden;
}
.app::before{
  content:"";position:absolute;left:0;right:0;top:0;height:4px;z-index:8;
  background:linear-gradient(90deg,#ffc107 0%,#ff9f45 24%,#b06bff 58%,#3b82f6 82%,#2ec27e 100%);opacity:.9;pointer-events:none;
}
.app::after{
  content:"";position:absolute;right:-70px;bottom:-80px;width:260px;height:260px;z-index:0;
  background:radial-gradient(circle at 50% 50%, rgba(255,193,7,.24), rgba(255,193,7,0) 68%);pointer-events:none;
}
@media (min-width:560px){
  .app{
    height:min(calc(100dvh - 48px), 900px);border:1px solid rgba(255,255,255,.9);border-radius:8px;
    box-shadow:14px 14px 0 rgba(110,120,170,.12), 0 0 0 1px rgba(22,22,31,.05), 0 34px 80px rgba(72,82,130,.24);
  }
}
.view{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;z-index:1}
.view[hidden]{display:none}

/* ===== 顶栏 ===== */
.topbar{
  display:flex;align-items:center;gap:10px;flex:none;padding:15px 14px 13px;
  background:linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,.42));
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-mark{
  width:42px;height:42px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,#eef4ff,#e3ebff);border:1px solid rgba(22,22,31,.08);border-radius:5px;
  box-shadow:2px 2px 0 rgba(96,106,150,.14), 0 6px 14px rgba(96,106,150,.10);overflow:hidden;
}
.brand-mark svg{width:32px;height:32px;display:block}
.brand-text{min-width:0}
.brand-title{font-size:18px;font-weight:800;letter-spacing:.08em;line-height:1.15;}
.brand-sub{margin-top:4px;font-family:var(--font-px);font-size:7px;color:var(--gold-d);letter-spacing:.14em;line-height:1;}
.icon-btn{
  width:44px;height:44px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.78);
  border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 2px 2px 0 var(--shadow-soft);
  color:var(--ink);cursor:pointer;padding:0;transition:background .14s linear, transform .1s linear;
}
.icon-btn svg{width:20px;height:20px}
.icon-btn:active{transform:translate(1px,1px);box-shadow:0 1px 0 rgba(255,255,255,.9) inset}
.icon-btn:focus-visible,.side-item:focus-visible,.dish:focus-visible,.btn:focus-visible,.pk:focus-visible,.pal:focus-visible,.picked-info:focus-visible,.s-row:focus-visible,.edit-chip:focus-visible{
  outline:3px solid rgba(47,124,246,.55);outline-offset:2px;
}

/* ===== 搜索 ===== */
.searchwrap{padding:12px 14px 4px;flex:none}
.search{
  display:flex;align-items:center;gap:9px;min-height:48px;padding:0 10px;
  background:rgba(255,255,255,.62);border:1px solid rgba(22,22,31,.09);border-radius:6px;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 6px 18px rgba(96,106,150,.08);
}
.search-ico{width:18px;height:18px;flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;height:44px;border:0;background:transparent;color:var(--ink);font-family:inherit;font-size:16px;outline:none;}
.search input::placeholder{color:#a3a3b8}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
.search-clear{width:32px;height:32px;flex:none;display:grid;place-items:center;background:transparent;border:0;color:var(--muted);cursor:pointer;padding:0;visibility:hidden;}
.search-clear[data-on="1"]{visibility:visible}
.search-clear svg{width:14px;height:14px}

/* ===== 主区域 ===== */
.main-area{flex:1;min-height:0;display:flex}
.sidebar{
  width:88px;flex:none;overflow-y:auto;background:rgba(255,255,255,.42);
  border-right:1px solid var(--line);padding:6px 0 12px;scrollbar-width:none;
}
.sidebar::-webkit-scrollbar{display:none}
.side-item{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;padding:11px 4px;
  background:transparent;border:0;border-left:3px solid transparent;color:var(--ink-soft);font-family:inherit;font-size:12.5px;font-weight:700;
  cursor:pointer;text-align:center;letter-spacing:.02em;line-height:1.25;transition:background .14s linear, border-color .14s linear, color .14s linear;
}
.side-item .side-name{word-break:break-all}
.side-item .side-n{font-family:var(--font-px);font-size:8px;color:var(--muted);letter-spacing:0}
.side-item .side-badge{
  position:absolute;top:5px;right:4px;min-width:16px;height:16px;padding:0 4px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#ffd24a,#ffc107);color:#2b2000;font-size:9px;font-weight:800;border-radius:8px;
  border:1px solid rgba(255,255,255,.95);box-shadow:0 1px 4px rgba(201,154,0,.45);line-height:1;letter-spacing:0;z-index:2;
}
.side-item[aria-pressed="true"]{background:rgba(255,255,255,.92);border-left-color:var(--gold);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.9) inset;}
.side-item[aria-pressed="true"] .side-n{color:var(--gold-d)}

.content{flex:1;min-width:0;display:flex;flex-direction:column}
.meta-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:11px 14px 8px;flex:none;font-size:12px;color:var(--muted);}
.meta-row b{color:var(--ink);font-family:var(--font-px);font-size:11px;letter-spacing:0}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.grid{display:flex;flex-direction:column;gap:9px;padding:0 12px 20px;}
.dish{
  position:relative;display:flex;align-items:center;gap:10px;padding:9px 10px 9px 11px;
  background:linear-gradient(180deg, #ffffff, #fdfdff);border:1px solid rgba(22,22,31,.08);
  border-left:3px solid color-mix(in srgb, var(--accent,#ffc107) 65%, transparent);border-radius:7px;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 2px 2px 0 var(--shadow-soft);text-align:left;cursor:pointer;font-family:inherit;color:inherit;
  transition:border-color .14s linear, background .14s linear, transform .1s linear, box-shadow .14s linear;
}
.dish:active{transform:translate(1px,1px);box-shadow:0 1px 0 rgba(255,255,255,.9) inset}
.dish .thumb{width:46px;height:46px;flex:none;display:grid;place-items:center;background:#f6f7fc;border:1px solid rgba(22,22,31,.06);border-radius:6px;overflow:hidden;}
.dish .thumb svg{width:36px;height:36px;display:block;filter:drop-shadow(0 2px 0 rgba(22,22,31,.08))}
.dish .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dish .name{font-size:14px;font-weight:800;line-height:1.25;letter-spacing:.01em;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dish .tags{display:flex;flex-wrap:wrap;gap:4px}
.dish .pick-btn{
  flex:none;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:4px 8px;line-height:1.2;
  white-space:nowrap;background:rgba(255,255,255,.6);transition:all .14s linear;
}
.dish.is-picked{
  border-color:rgba(224,168,0,.5);border-left-color:var(--gold);background:linear-gradient(180deg,#fffdf4,#fff6d8);
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 2px 2px 0 rgba(224,168,0,.16);
}
.dish.is-picked .pick-btn{color:var(--gold-d);border-color:var(--gold);background:#fff2c2}

.tag{display:inline-flex;align-items:center;height:19px;padding:0 5px;font-size:11px;line-height:1;border:1px solid currentColor;letter-spacing:.02em;white-space:nowrap;border-radius:3px;}
.tag.hot{color:#c92a2a;background:#ffeceb;border-color:#ffc9c5}
.tag.veg{color:#0b7a52;background:#e6faf1;border-color:#a9e8cd}
.tag.cold{color:#1b63c9;background:#eaf2ff;border-color:#bcd6ff}
.tag.star{color:#9a6b00;background:#fff6d9;border-color:#ffdf94}
.tag.sweet{color:#7b34c9;background:#f5ecff;border-color:#ddc4ff}
.tag.normal{color:#5a5a72;background:#f1f2f8;border-color:#d6d8e6}

.empty{margin:6px 12px 20px;padding:26px 16px;text-align:center;border:2px dashed var(--line2);color:var(--muted);font-size:14px;line-height:1.9;background:rgba(255,255,255,.52);border-radius:8px;}
.empty b{display:block;font-family:var(--font-px);font-size:11px;color:var(--line2);margin-bottom:8px}

@media (max-width:380px){
  .sidebar{width:76px}
  .side-item{font-size:12px;padding:10px 3px}
}

/* ===== 底部已选栏 ===== */
.picked-bar{
  display:flex;align-items:center;gap:10px;flex:none;padding:11px 12px calc(11px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.90));
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);box-shadow:0 -10px 26px rgba(96,106,150,.07);
}
.picked-info{
  flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px;background:transparent;border:0;padding:2px 4px;text-align:left;cursor:pointer;
  color:inherit;font-family:inherit;overflow:hidden;border-radius:6px;
}
.picked-info:active{transform:translate(1px,1px)}
.picked-num{font-family:var(--font-px);font-size:13px;color:var(--gold-d);line-height:1.1;white-space:nowrap}
.picked-num small{font-size:11px;color:var(--muted);margin-left:4px;letter-spacing:.04em;font-family:var(--font-cn)}
.picked-sub{font-size:12px;color:var(--muted);letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picked-bar .btn{flex:none;padding:0 12px;font-size:14px;white-space:nowrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:0 16px;border:1px solid #d9a400;
  background:linear-gradient(180deg,#ffd24a,#ffc107);color:#2b2000;font-size:15px;font-weight:800;letter-spacing:.03em;border-radius:7px;cursor:pointer;
  box-shadow:0 1px 0 rgba(255,255,255,.65) inset, 0 6px 16px rgba(255,193,7,.28), 2px 2px 0 rgba(201,154,0,.20);transition:filter .14s linear, transform .1s linear;
}
.btn:active:not([disabled]){transform:translate(1px,1px);box-shadow:0 1px 0 rgba(255,255,255,.65) inset, 0 2px 8px rgba(255,193,7,.22)}
.btn.block{width:100%}
.btn.ghost{background:rgba(255,255,255,.82);color:var(--ink);border-color:var(--line2);box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 2px 2px 0 var(--shadow-soft);}
.btn.danger{background:#fff2f1;color:#c92a2a;border-color:#f3b7b2;box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 2px 2px 0 rgba(201,42,42,.10);}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.btn svg{width:16px;height:16px}

/* ===== 编辑页 ===== */
.edit-title{font-size:17px;font-weight:800;letter-spacing:.08em;line-height:1.2}
.save-btn{min-height:42px;padding:0 13px;font-size:14px;flex:none}
.edit-tabs{display:flex;gap:8px;padding:12px 14px 4px;flex:none}
.etab{
  flex:1;min-height:42px;background:rgba(255,255,255,.72);border:1px solid var(--line);color:var(--ink-soft);font-size:14px;font-weight:700;cursor:pointer;
  border-radius:8px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 2px 2px 0 var(--shadow-soft);display:flex;align-items:center;justify-content:center;gap:6px;
}
.etab .n{font-family:var(--font-px);font-size:8px;color:var(--muted)}
.etab[aria-selected="true"]{background:linear-gradient(180deg,#fff6d6,#ffefb8);border-color:rgba(224,168,0,.5);color:var(--gold-d);box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 2px 2px 0 rgba(224,168,0,.18);}
.edit-pane{padding:10px 14px 20px}
.edit-skip{font-size:12px;color:var(--muted);line-height:1.7;padding:0 14px 12px;}
.e-list{display:flex;flex-direction:column;gap:10px}
.e-row{display:flex;align-items:center;gap:8px;padding:8px;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 2px 2px 0 var(--shadow-soft);}
.e-idx{font-family:var(--font-px);font-size:9px;color:var(--muted);flex:none;width:22px;text-align:center}
.e-cat-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cat-count{font-size:9.5px;color:var(--muted);letter-spacing:.04em;padding-left:3px}
.mini{width:36px;height:36px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.9);border:1px solid var(--line);color:var(--ink);cursor:pointer;padding:0;border-radius:6px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 2px 2px 0 var(--shadow-soft);}
.mini svg{width:14px;height:14px}
.mini:active{transform:translate(1px,1px);box-shadow:none}
.mini.danger{color:#c92a2a;border-color:#f3b7b2;background:#fff6f5}
.mini[disabled]{opacity:.32;cursor:not-allowed}
.inp{width:100%;min-height:42px;padding:7px 10px;background:rgba(255,255,255,.92);border:1px solid rgba(22,22,31,.12);color:var(--ink);font-family:inherit;font-size:16px;outline:none;border-radius:6px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 4px 12px rgba(96,106,150,.06);}
.inp:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(47,124,246,.16)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px;}
.e-add{display:flex;gap:8px;margin-top:14px}
.e-add .inp{flex:1;min-width:0}
.e-add .btn{min-height:46px;padding:0 14px;font-size:14px;flex:none}
.e-toolbar{margin-top:2px}
.e-dish{border:1px solid var(--line);background:rgba(255,255,255,.86);border-radius:8px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 2px 2px 0 var(--shadow-soft);}
.e-dish[data-open="1"]{border-color:rgba(224,168,0,.5);box-shadow:0 0 0 3px rgba(255,193,7,.12), 2px 2px 0 rgba(224,168,0,.16);}
.e-head{display:flex;align-items:center;gap:9px;width:100%;padding:9px;background:transparent;border:0;color:var(--ink);cursor:pointer;text-align:left;border-radius:8px;}
.e-thumb{width:38px;height:38px;flex:none;display:grid;place-items:center;background:#f6f7fc;border:1px solid rgba(22,22,31,.07);border-radius:6px;}
.e-thumb svg{width:28px;height:28px}
.e-main{flex:1;min-width:0}
.e-main b{display:block;font-size:14px;font-weight:700;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.e-sub{display:block;font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.e-caret{width:16px;height:16px;flex:none;color:var(--muted);transition:transform .12s linear}
.e-dish[data-open="1"] .e-caret{transform:rotate(180deg);color:var(--gold-d)}
.e-body{padding:4px 9px 11px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:10px}
.e-body[hidden]{display:none}
.field{display:flex;flex-direction:column;gap:5px}
.field>label{font-size:11px;color:var(--muted);letter-spacing:.1em}
.picker{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pk{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 3px;background:#f7f8fc;border:1px solid #e6e8f3;color:var(--ink-soft);cursor:pointer;border-radius:6px;}
.pk svg{width:26px;height:26px}
.pk span{font-size:9px;letter-spacing:.04em}
.pk[data-on="1"]{border-color:var(--gold);background:linear-gradient(180deg,#fffbe9,#fff2c2);color:var(--gold-d);box-shadow:0 0 0 2px #fff, 0 0 0 4px rgba(255,193,7,.35);}
.pals{display:flex;gap:8px;flex-wrap:wrap}
.pal{width:34px;height:34px;border:2px solid #e6e8f3;cursor:pointer;padding:0;border-radius:6px;box-shadow:2px 2px 0 var(--shadow-soft);}
.pal[data-on="1"]{border-color:#fff;box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--gold)}
.edit-foot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex:none;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,.9));}
.foot-tip{font-size:10px;color:var(--muted);text-align:center;line-height:1.5;letter-spacing:.02em;}
.dirty{font-size:11px;color:var(--muted);text-align:center;line-height:1.4;letter-spacing:.06em}
.dirty[data-on="1"]{color:var(--gold-d);font-weight:700}

/* ===== 编辑菜品页分类筛选 ===== */
.edit-chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;}
.edit-chips::-webkit-scrollbar{display:none}
.edit-chip{flex:none;height:32px;padding:0 12px;background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:16px;color:var(--ink-soft);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;transition:all .14s linear;box-shadow:0 1px 0 rgba(255,255,255,.9) inset;}
.edit-chip:active{transform:translate(1px,1px)}
.edit-chip.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-d);box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 2px 6px rgba(201,154,0,.15);}

/* ===== 弹层 ===== */
.layer{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(34,38,62,.34);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);overflow-y:auto;}
.layer.on{display:flex}
.pxwin{
  position:relative;z-index:1;width:100%;max-width:392px;max-height:calc(100dvh - 28px);display:flex;flex-direction:column;
  background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.94));-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  overflow:hidden;border:1px solid rgba(224,168,0,.45);border-radius:12px;
  box-shadow:0 0 0 1px rgba(255,255,255,.9), 0 30px 70px rgba(60,70,120,.28), 0 2px 0 rgba(255,255,255,.9) inset;animation:pop .26s steps(4) both;
}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.win-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;padding:12px 12px 12px 14px;background:linear-gradient(180deg, rgba(255,251,238,.95), rgba(255,255,255,.7));border-bottom:1px solid rgba(224,168,0,.25);}
.win-title{font-family:var(--font-px);font-size:9px;color:var(--gold-d);letter-spacing:.14em;line-height:1.4}
.win-sub{font-size:10px;color:var(--muted);letter-spacing:.18em;margin-top:4px;line-height:1}
.win-x{width:32px;height:32px;flex:none;display:grid;place-items:center;padding:0;background:rgba(255,255,255,.9);border:1px solid var(--line2);border-radius:6px;color:var(--ink);cursor:pointer;}
.win-x svg{width:12px;height:12px}
.win-x:active{transform:translate(1px,1px)}
.win-scroll{padding:12px;overflow-y:auto;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain;}
.win-scroll::-webkit-scrollbar{width:6px}
.win-scroll::-webkit-scrollbar-track{background:transparent}
.win-scroll::-webkit-scrollbar-thumb{background:rgba(22,22,31,.16);border-radius:3px}
.win-foot{flex:none;padding:10px 12px 12px;border-top:1px solid var(--line);background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.9));display:flex;flex-direction:column;gap:10px;}

/* 日期卡 */
.date-card{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:13px;border:1px solid rgba(224,168,0,.28);border-radius:9px;background-color:#fffdf6;background-image:radial-gradient(circle at 88% 12%, rgba(255,193,7,.30) 0 2px, transparent 2px),radial-gradient(circle at 76% 68%, rgba(47,124,246,.18) 0 1px, transparent 1px),linear-gradient(135deg, rgba(255,248,225,.9), rgba(255,255,255,.9));box-shadow:0 8px 20px rgba(255,193,7,.10);}
.dc-left{display:flex;flex-direction:column;align-items:center;gap:2px;padding-right:12px;border-right:2px dashed rgba(224,168,0,.28);}
.dc-day{font-family:var(--font-px);font-size:30px;line-height:1;color:var(--gold-d)}
.dc-mon{font-family:var(--font-px);font-size:8px;color:var(--muted);margin-top:7px;letter-spacing:.1em}
.dc-right{display:flex;flex-direction:column;gap:5px;min-width:0}
.dc-week{font-size:19px;font-weight:800;letter-spacing:.06em;line-height:1.2}
.dc-year{font-size:11px;color:var(--muted);letter-spacing:.08em}
.dc-yi{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12px;color:var(--gold-d)}
.dc-yi i{font-style:normal;font-family:var(--font-px);font-size:8px;color:#2b2000;background:var(--gold);padding:4px 4px 3px;line-height:1;letter-spacing:0;border-radius:3px;}
.m-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.m-head b{font-family:var(--font-px);font-size:11px;color:var(--ink)}
.m-list{display:flex;flex-direction:column;border:1px solid var(--line);background:rgba(255,255,255,.75);border-radius:9px;overflow:hidden;}
.m-row{display:flex;align-items:center;gap:9px;padding:9px;border-bottom:1px dashed var(--line)}
.m-row:last-child{border-bottom:0}
.m-ico{width:36px;height:36px;flex:none;display:grid;place-items:center;background:#f6f7fc;border:1px solid rgba(22,22,31,.07);border-radius:6px;}
.m-ico svg{width:27px;height:27px}
.m-txt{flex:1;min-width:0}
.m-name{font-size:14px;font-weight:700;line-height:1.35}
.m-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.m-tags .tag{height:16px;font-size:10px;padding:0 4px;border-width:1px}
.stats{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);background:rgba(255,255,255,.75);border-radius:9px;overflow:hidden;}
.stat{padding:11px 4px;text-align:center;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--font-px);font-size:12px;color:var(--ink);line-height:1.4}
.stat b.gold{color:var(--gold-d)}
.stat span{display:block;font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.1em}
.win-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:2px}
.win-actions .btn{min-height:44px;font-size:14px}
.win-note{font-size:11px;color:var(--muted);text-align:center;line-height:1.7;letter-spacing:.03em}

/* 已选 / 添加 行 */
.s-list{display:flex;flex-direction:column;gap:8px}
.s-row{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 2px 2px 0 var(--shadow-soft);text-align:left;font-family:inherit;font-size:14px;color:inherit;cursor:pointer;}
.s-row.pick.on{border-color:rgba(224,168,0,.5);background:linear-gradient(180deg,#fffdf4,#fff6d8);box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 2px 2px 0 rgba(224,168,0,.16);}
.s-row:active{transform:translate(1px,1px);box-shadow:none}
.s-mark{flex:none;font-size:11px;font-weight:700;letter-spacing:.04em;border:1px solid var(--line2);color:var(--muted);padding:2px 6px;line-height:1.4;border-radius:4px;white-space:nowrap;}
.s-row.pick.on .s-mark{color:var(--gold-d);border-color:var(--gold);background:#fff2c2}
.s-row .mini{margin-left:auto}
.group-title{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.1em;padding:8px 2px 2px;}
.group-title:first-child{padding-top:2px}

/* 小确认窗 */
.dlg{max-width:340px;border-color:var(--line2);box-shadow:0 0 0 1px rgba(255,255,255,.9), 0 30px 70px rgba(60,70,120,.26);}
.dlg .win-bar{border-bottom-color:var(--line)}
.dlg .win-title{color:var(--ink);font-size:8px}
.dlg-body{padding:15px 13px;display:flex;flex-direction:column;gap:12px}
.dlg-msg{font-size:14px;line-height:1.7;color:var(--ink-soft);margin:0}
.dlg-msg strong{color:var(--gold-d);font-weight:700}
.dlg-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dlg-actions .btn{min-height:42px;font-size:13px}
.auth-err{font-size:12px;color:#c92a2a;background:#ffeceb;border:1px solid #ffc9c5;padding:7px 9px;letter-spacing:.04em;border-radius:6px;}

/* ===== toast ===== */
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,12px);z-index:90;padding:10px 15px;background:linear-gradient(180deg,#ffd24a,#ffc107);color:#2b2000;border:1px solid #d9a400;border-radius:8px;box-shadow:0 10px 26px rgba(201,154,0,.35);font-size:13px;font-weight:800;letter-spacing:.04em;opacity:0;pointer-events:none;transition:opacity .14s linear,transform .14s linear;max-width:calc(100% - 32px);text-align:center;}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== 桌面悬停反馈 ===== */
@media (hover:hover){
  .dish:hover{border-color:rgba(22,22,31,.16);transform:translateY(-1px);box-shadow:0 4px 14px rgba(96,106,150,.14);}
  .dish.is-picked:hover{border-color:rgba(224,168,0,.65);}
  .side-item:hover{background:rgba(255,255,255,.68)}
  .icon-btn:hover{background:rgba(255,255,255,.95)}
  .btn:hover:not([disabled]){filter:brightness(1.02)}
  .mini:hover:not([disabled]){background:#fff}
  .edit-chip:hover:not(.on){background:#fff;border-color:var(--line2)}
}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
</style>

  function iconHTML(tpl, pal, size) {
    var g = ICONS[tpl] || ICONS.plate, p = PALETTES[pal] || PALETTES.gold, out = '';
    for (var y = 0; y < g.length; y++) {
      for (var x = 0; x < g[y].length; x++) {
        var c = g[y].charAt(x); if (c === '.') continue;
        out += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + (c === '1' ? p[0] : c === '2' ? p[1] : p[2]) + '"/>';
      }
    }
    return '<svg viewBox="0 0 12 12" width="' + size + '" height="' + size + '" shape-rendering="crispEdges" aria-hidden="true">' + out + '</svg>';
  }

  var HOT = /辣|麻|重口|爆|椒麻/, VEG = /素|清淡|清爽|解腻|青菜/, COLD = /冰|凉|冷/, STAR = /招牌|必点|新品|推荐|限量|热卖/, SWEET = /甜|奶|蛋糕|冰淇淋/;
  function tagKind(t) { if (HOT.test(t)) return 'hot'; if (COLD.test(t)) return 'cold'; if (SWEET.test(t)) return 'sweet'; if (VEG.test(t)) return 'veg'; if (STAR.test(t)) return 'star'; return 'normal'; }
  function tagsHTML(tags, limit) { return (tags || []).filter(Boolean).slice(0, limit || 9).map(function (t) { return '<span class="tag ' + tagKind(t) + '">' + esc(t) + '</span>'; }).join(''); }

  function renderSidebar() {

  function openLayer(html) { layer.innerHTML = html; layer.classList.add('on'); document.body.classList.add('lock'); }
  function closeLayer() { if (confirmResolve) { var r = confirmResolve; confirmResolve = null; r(false); } layer.classList.remove('on'); layer.innerHTML = ''; document.body.classList.remove('lock'); }
  function askConfirm(title, msg, okText, cancelText) {

  function todayHTML() {

    if (spicy >= 3 && spicy * 2 > items.length) lvl = '重辣';

  /* ===== 已选弹窗 ===== */
  function pickNoteText() { var n = picked.size; return pickMode === 'picked' ? (n ? '已选 ' + n + ' 道 · 点右侧 × 可以拿掉' : '还没有选菜，点下面按钮去加') : '点菜品即可加入或取消 · 当前已选 ' + n + ' 道'; }

  var upSVG = '<svg viewBox="0 0 12 12" shape-rendering="crispEdges" fill="currentColor"><path d="M5 3h2v1H5zM4 4h4v1H4zM3 5h6v1H3zM2 6h8v1H2z"/></svg>';

  var chevSVG = '<svg viewBox="0 0 12 12" shape-rendering="crispEdges" fill="currentColor"><path d="M3 4h2v2H3zM5 6h2v2H5zM7 6h2v2H7zM9 4h2v2H9z"/></svg>';

  function renderCats() {

      if (editCat !== 'all' && d.cat !== editCat) return false;

  function findDish(id) { return draft.dishes.filter(function (d) { return d.id === id; })[0]; }
  function addCat() {
    var input = $('newCatName'), name = (input && input.value || '').trim();
    if (!name) { toast('先写个分类名'); if (input) input.focus(); return; }
    draft.cats.push({ id: 'c' + Date.now().toString(36), name: name });
    markDirty(); renderCats(); var ni = $('newCatName'); if (ni) ni.focus(); toast('分类已添加');
  }
  function moveCat(id, dir) {
    var i = draft.cats.findIndex(function (c) { return c.id === id; }), j = i + dir;
    if (i < 0 || j < 0 || j >= draft.cats.length) return;
    var t = draft.cats[i]; draft.cats[i] = draft.cats[j]; draft.cats[j] = t; markDirty(); renderCats();
  }
  function delCat(id) {
    var c = draft.cats.filter(function (x) { return x.id === id; })[0]; if (!c) return;
    if (draft.cats.length <= 1) { toast('至少保留一个分类'); return; }
    var n = draft.dishes.filter(function (d) { return d.cat === id; }).length;
    var fallback = draft.cats.filter(function (x) { return x.id !== id; })[0];
    askConfirm('删除分类？', n ? '「' + esc(c.name) + '」下还有 <strong>' + n + '</strong> 道菜，删除后它们会移到「' + esc(fallback.name) + '」。' : '「' + esc(c.name) + '」会从点菜页消失。', '删除', '取消').then(function (ok) {
      if (!ok) return;
      draft.cats = draft.cats.filter(function (x) { return x.id !== id; });
      draft.dishes.forEach(function (d) { if (d.cat === id) d.cat = fallback.id; });
      if (editCat === id) editCat = 'all';
      markDirty(); renderEdit(); toast('分类已删除');
    });
  }
  function addDish() {
    if (!draft.cats.length) { toast('先建一个分类'); return; }
    var id = 'd' + Date.now().toString(36), defaultCat = editCat !== 'all' ? editCat : draft.cats[0].id;
    draft.dishes.push({ id: id, name: '新菜品', cat: defaultCat, tags: [], tpl: 'plate', pal: 'gold' });
    expanded = id; editQ = ''; markDirty(); renderEdit();
    setTimeout(function () {
      var el = document.querySelector('.e-dish[data-open="1"]'); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      var inp = document.querySelector('input[data-field="name"][data-id="' + id + '"]'); if (inp) { inp.focus(); inp.select(); }
    }, 80);
  }
  function delDish(id) {
    var d = findDish(id); if (!d) return;
    askConfirm('删除菜品？', '「' + esc(d.name) + '」会从菜单里删掉，保存后生效。', '删除', '取消').then(function (ok) {
      if (!ok) return;
      draft.dishes = draft.dishes.filter(function (x) { return x.id !== id; });
      picked.delete(id); savePicked(); expanded = null; markDirty(); renderEdit(); toast('菜品已删除');
    });
  }

  function base64EncodeUnicode(str) { return btoa(unescape(encodeURIComponent(str))); }
  function saveToGitHub(data) {
    var apiBase = 'https://api.github.com/repos/' + encodeURIComponent(GH.owner) + '/' + encodeURIComponent(GH.repo) + '/contents/' + encodeURIComponent(GH.path).replace(/%2F/g, '/');
    var headers = { 'Authorization': 'Bearer ' + GH.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    return fetch(apiBase + '?ref=' + encodeURIComponent(GH.branch), { headers: headers, cache: 'no-store' })
      .then(function (r) {
        if (r.status === 404) return null;
        if (!r.ok) return r.json().then(function (e) { throw new Error('读取失败：' + (e.message || r.status)); });
        return r.json();
      }).then(function (existing) {
        var body = { message: '更新像素食堂菜单 ' + new Date().toLocaleString('zh-CN'), content: base64EncodeUnicode(JSON.stringify(data, null, 2)), branch: GH.branch };
        if (existing && existing.sha) body.sha = existing.sha;
        return fetch(apiBase, { method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, headers), body: JSON.stringify(body) });
      }).then(function (r) {
        if (!r.ok) return r.json().then(function (e) { throw new Error(e.message || ('保存失败 ' + r.status)); });
        return r.json();
      });
  }

  function saveEdit() {
    if (isSaving) return;
    var bad = draft.cats.some(function (c) { return !String(c.name).trim(); }) || draft.dishes.some(function (d) { return !String(d.name).trim(); });
    if (bad) { toast('分类和菜品名称不能为空'); return; }
    var fallback = draft.cats[0] ? draft.cats[0].id : '';
    draft.dishes.forEach(function (d) { if (!draft.cats.some(function (c) { return c.id === d.cat; })) d.cat = fallback; });

    db = clone(draft); dirty = false; renderEdit(); refreshMenu();
    if (!GH.ready()) { openSyncSettings('首次保存需要配置 GitHub 云端同步'); return; }

    isSaving = true;
    var saveBtn = $('btnSave');
    if (saveBtn) { saveBtn.textContent = '同步中...'; saveBtn.disabled = true; }
    dirtyFlag.textContent = '正在同步到云端...'; dirtyFlag.dataset.on = '1';

    saveToGitHub(db).then(function () {
      dirtyFlag.textContent = '已同步，稍等 1 分钟生效'; dirtyFlag.dataset.on = '0';
      toast('已同步，Netlify 需要几十秒重新部署');
    }).catch(function (err) {
      dirtyFlag.textContent = '云端同步失败'; dirtyFlag.dataset.on = '1';
      openSyncSettings('同步失败：' + (err.message || '请检查配置'));
    }).finally(function() {
      isSaving = false;
      if (saveBtn) { saveBtn.textContent = '保存'; saveBtn.disabled = false; }
    });
  }

  function backToMenu() {
    if (!dirty) { exitEdit(); return; }
    askConfirm('放弃未保存的改动？', '这次改动还没有保存，返回后会回到上一次保存的菜单。', '放弃改动', '继续编辑').then(function (ok) { if (ok) exitEdit(); });
  }

  function openSyncSettings(msg) {
    openLayer('<div class="pxwin dlg" role="dialog" aria-modal="true" aria-label="云端同步设置"><div class="win-bar">' +
      '<div><div class="win-title">CLOUD SYNC</div><div class="win-sub">云端同步设置</div></div><button class="win-x" data-act="close" aria-label="关闭">' + xSVG + '</button></div>' +
      '<div class="dlg-body">' + (msg ? '<div class="auth-err">' + esc(msg) + '</div>' : '') +
      '<div class="field"><label>GitHub Token（Contents 读写权限）</label><input class="inp" id="ghToken" type="password" value="' + esc(GH.token) + '" placeholder="github_pat_xxx" autocomplete="off"></div>' +
      '<div class="field"><label>用户名 / 组织</label><input class="inp" id="ghOwner" value="' + esc(GH.owner) + '" placeholder="your-name" autocomplete="off"></div>' +
      '<div class="field"><label>仓库名</label><input class="inp" id="ghRepo" value="' + esc(GH.repo) + '" placeholder="pixel-diner" autocomplete="off"></div>' +
      '<div class="field"><label>分支</label><input class="inp" id="ghBranch" value="' + esc(GH.branch) + '" placeholder="main" autocomplete="off"></div>' +
      '<div class="field"><label>数据文件路径</label><input class="inp" id="ghPath" value="' + esc(GH.path) + '" placeholder="menu.json" autocomplete="off"></div>' +
      '<div class="dlg-actions"><button class="btn ghost" data-act="close">取消</button><button class="btn" data-act="save-gh">保存并同步</button></div>' +
      '<div class="win-note">Token 只保存在当前浏览器，不会上传到服务器。<br>建议使用 Fine-grained token，只给目标仓库 <b>Contents: Read and write</b> 权限。</div></div></div>');
  }

  function bootLoad() {
    fetch('./menu.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (data && isPlainDB(data)) { db = data; }
      })
      .catch(function () {})
      .finally(function() {
        loadPicked();
        refreshMenu();
      });
  }

  function enterEdit() {
    draft = clone(db); dirty = false; expanded = null; editQ = ''; editCat = 'all'; editTab = 'cats';
    viewMenu.hidden = true; viewEdit.hidden = false; renderEdit();
    if (editScroll) editScroll.scrollTop = 0;
    if (location.hash !== '#/edit') location.hash = '#/edit';
  }
  function exitEdit() {
    draft = null; dirty = false; viewMenu.hidden = false; viewEdit.hidden = true; refreshMenu();
    if (menuScroll) menuScroll.scrollTop = 0;
    if (location.hash !== '#/' && location.hash !== '') location.hash = '#/';
  }

  function route() {
    var isEdit = location.hash === '#/edit';
    if (isEdit && !authed) { location.hash = '#/'; openAuth(); return; }
    viewMenu.hidden = isEdit; viewEdit.hidden = !isEdit;
    if (isEdit) {
      if (!draft) { draft = clone(db); dirty = false; expanded = null; editQ = ''; editCat = 'all'; editTab = 'cats'; }
      renderEdit(); if (editScroll) editScroll.scrollTop = 0;
    } else {
      draft = null; dirty = false; refreshMenu(); if (menuScroll) menuScroll.scrollTop = 0;
    }
  }

  sidebar.addEventListener('click', function (e) {
    var b = e.target.closest('.side-item'); if (!b) return;
    cat = b.dataset.cat;
    if (q) { q = ''; searchInput.value = ''; searchClear.dataset.on = '0'; }
    renderSidebar(); renderGrid(); if (menuScroll) menuScroll.scrollTop = 0;
  });

  searchInput.addEventListener('input', function () {
    q = searchInput.value; searchClear.dataset.on = q ? '1' : '0';
    if (q.trim() && cat !== 'all') { cat = 'all'; renderSidebar(); }
    renderGrid();
  });
  searchClear.addEventListener('click', function () {
    q = ''; searchInput.value = ''; searchClear.dataset.on = '0'; searchInput.focus(); renderGrid();
  });

  grid.addEventListener('click', function (e) {
    var card = e.target.closest('.dish'); if (!card) return;
    var id = card.dataset.id;
    if (picked.has(id)) picked.delete(id); else picked.add(id);
    savePicked(); renderSidebar(); renderGrid(); renderBar();
  });

  btnToday.addEventListener('click', function () { if (picked.size) openLayer(todayHTML()); });
  $('pickedOpen').addEventListener('click', function () { pickMode = 'picked'; openLayer(pickLayerHTML()); });

  layer.addEventListener('click', function (e) {
    if (e.target === layer) { closeLayer(); return; }
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act, id = b.dataset.id;

    if (act === 'close') { closeLayer(); return; }
    if (act === 'cancel' || act === 'confirm') {
      var r = confirmResolve; confirmResolve = null; layer.classList.remove('on'); layer.innerHTML = ''; document.body.classList.remove('lock'); if (r) r(act === 'confirm'); return;
    }
    if (act === 'login') { doLogin(); return; }
    if (act === 'save-gh') {
      var t = ($('ghToken') || {}).value || '', o = ($('ghOwner') || {}).value || '', rp = ($('ghRepo') || {}).value || '', br = ($('ghBranch') || {}).value || 'main', pt = ($('ghPath') || {}).value || 'menu.json';
      if (!t.trim() || !o.trim() || !rp.trim()) { toast('Token、用户名、仓库名都要填'); return; }
      GH.set(t.trim(), o.trim(), rp.trim(), br.trim(), pt.trim()); closeLayer(); toast('配置已保存，正在同步...');
      dirtyFlag.textContent = '正在同步到云端...'; dirtyFlag.dataset.on = '1';
      saveToGitHub(db).then(function () { dirtyFlag.textContent = '已同步，稍等 1 分钟生效'; dirtyFlag.dataset.on = '0'; toast('已同步，Netlify 需要几十秒重新部署'); })
        .catch(function (err) { dirtyFlag.textContent = '云端同步失败'; dirtyFlag.dataset.on = '1'; openSyncSettings('同步失败：' + (err.message || '请检查配置')); });
      return;
    }
    if (act === 'done') { closeLayer(); return; }
    if (act === 'toadd') { pickMode = 'all'; layer.innerHTML = pickLayerHTML(); return; }
    if (act === 'topicked') { pickMode = 'picked'; layer.innerHTML = pickLayerHTML(); return; }
    if (act === 'tp') {
      if (picked.has(id)) picked.delete(id); else picked.add(id);
      savePicked(); var on = picked.has(id); b.classList.toggle('on', on);
      var mark = b.querySelector('.s-mark'); if (mark) mark.textContent = on ? '已选' : '+ 加入';
      updatePickNote(); renderSidebar(); renderBar(); renderGrid(); return;
    }
    if (act === 'rm') {
      picked.delete(id); savePicked(); var row = b.closest('.s-row'); if (row) row.remove();
      renderSidebar(); renderBar(); renderGrid();
      if (!picked.size) { layer.innerHTML = pickLayerHTML(); } else { updatePickNote(); }
      return;
    }
  });

  document.addEventListener('keydown', function (e) {
    if (!layer.classList.contains('on')) return;
    if (e.key === 'Escape') { closeLayer(); return; }
    if (e.key === 'Enter' && $('authUser')) { e.preventDefault(); doLogin(); }
  });

  $('btnEdit').addEventListener('click', function () { if (!authed) { openAuth(); } else { enterEdit(); } });
  $('btnBack').addEventListener('click', backToMenu);
  $('btnSave').addEventListener('click', saveEdit);
  $('tabCats').addEventListener('click', function () { editTab = 'cats'; renderEdit(); });
  $('tabDishes').addEventListener('click', function () { editTab = 'dishes'; renderEdit(); });

  function handleEditInput(e) {
    var el = e.target;
    if (el.id === 'editSearch') {
      editQ = el.value; var pos = el.selectionStart; renderDishes(); var ni = $('editSearch');
      if (ni) { ni.focus(); if (pos != null) ni.setSelectionRange(pos, pos); } return;
    }
    if (el.dataset.req === 'catname') {
      var c = draft.cats.filter(function (x) { return x.id === el.dataset.id; })[0]; if (c) { c.name = el.value; markDirty(); } return;
    }
    var f = el.dataset.field; if (!f) return;
    var d = findDish(el.dataset.id); if (!d) return;
    if (f === 'tags') d.tags = el.value.split(/[,，、]/).map(function (s) { return s.trim(); }).filter(Boolean);
    else if (f === 'cat') d.cat = el.value;
    else { d[f] = el.value; if (f === 'name') { var box = el.closest('.e-dish'), live = box && box.querySelector('[data-live-name]'); if (live) live.textContent = el.value || '未命名'; } }
    markDirty();
  }
  editScroll.addEventListener('input', handleEditInput);
  editScroll.addEventListener('change', handleEditInput);

  editScroll.addEventListener('click', function (e) {
    var ecatEl = e.target.closest('[data-ecat]');
    if (ecatEl) { editCat = ecatEl.dataset.ecat; renderDishes(); return; }
    var el = e.target.closest('[data-act]'); if (!el) return;
    var act = el.dataset.act, id = el.dataset.id;
    if (act === 'toggle') { expanded = expanded === id ? null : id; renderDishes(); return; }
    if (act === 'cat-up' || act === 'cat-down') { moveCat(id, act === 'cat-up' ? -1 : 1); return; }
    if (act === 'cat-del') { delCat(id); return; }
    if (act === 'cat-add') { addCat(); return; }
    if (act === 'dish-add') { addDish(); return; }
    if (act === 'dish-del') { delDish(id); return; }
    if (act === 'tpl') { var td = findDish(id); if (td) { td.tpl = el.dataset.tpl; markDirty(); renderDishes(); } return; }
    if (act === 'pal') { var pd = findDish(id); if (pd) { pd.pal = el.dataset.pal; markDirty(); renderDishes(); } }
  });

  window.addEventListener('hashchange', route);

  $('brandMark').innerHTML = avatarSVG(32);
  try {
    var favSvg = avatarSVG(32).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
    var favLink = document.querySelector('link[rel="icon"]');
    if (favLink) favLink.href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(favSvg);
  } catch (e) {}

  $('btnEdit').innerHTML = '<svg viewBox="0 0 12 12" shape-rendering="crispEdges" fill="currentColor"><path d="M4 3h4v1H4zM3 4h1v4H3zM8 4h1v4H8zM4 8h4v1H4zM5 1h2v1H5zM5 10h2v1H5zM1 5h1v2H1zM10 5h1v2h-1z"/></svg>';
  $('btnBack').innerHTML = '<svg viewBox="0 0 12 12" shape-rendering="crispEdges" fill="currentColor"><path d="M4 3h2v2H4zM3 4h1v4H3zM4 7h2v2H4zM6 5h5v2H6z"/></svg>';

  route();
  bootLoad();
})();
</script>
</body>
</html>
